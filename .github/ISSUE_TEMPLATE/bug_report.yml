name: Bug report
description: Something doesn't work the way the docs say it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Please fill in as much as you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Minimal .env to reproduce
      description: The smallest `.env` (with tags) that shows the problem. **Replace real secrets with fake values.**
      render: sh
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: npx type-envgen .env -o src/env.ts
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output / error
      description: CLI output, or the relevant part of the generated file.
      render: text
  - type: input
    id: version
    attributes:
      label: type-envgen version
      placeholder: run `npx type-envgen --version`
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      placeholder: Node 22.22.1, Windows 11
    validations:
      required: true
